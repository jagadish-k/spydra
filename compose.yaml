# Spydra — dev topology per docs/DEVELOPMENT.md § Compose topology.
#
# render is ALONE on the egress network: api/worker reach it through the host
# loopback (RENDER_BASE_URL), and every inspection port binds 127.0.0.1 —
# that binding is part of the isolation boundary, not a style choice
# (ADR-0023). Do not "fix" this by sharing a network.
name: spydra

x-py-env: &py-env
  DATABASE_URL: postgresql+asyncpg://spydra_api:spydra@db:5432/spydra
  # Integration tests run against their own database, never the dev one
  # (TESTING.md §1). `make test-api` overrides DATABASE_URL with this.
  TEST_DATABASE_URL: postgresql+asyncpg://spydra_api:spydra@db:5432/spydra_test
  # ADR-0004: the crawler identifies itself honestly and does not impersonate
  # a browser. The contact address is the point — a site that wants the
  # crawling to stop has somewhere to write instead of a WAF rule to add.
  USER_AGENT: "${USER_AGENT:-MySampleScraper/1.0 (+https://jagadishk.work; k.jagdish@gmail.com)}"
  RENDER_BASE_URL: http://host.docker.internal:3001 # via host loopback — ADR-0023
  LLM_BASE_URL: http://host.docker.internal:8080
  ASSET_ROOT: /data/assets
  HTML_CACHE_ROOT: /data/html
  LOG_LEVEL: ${LOG_LEVEL:-info}

# Every inspection port binds to 127.0.0.1 only. On Docker Desktop a
# container can probe the host's published ports via host.docker.internal;
# loopback-only binding is what keeps the render sidecar's isolation real
# (ADR-0023). Binding any of these to 0.0.0.0 reopens the boundary.

services:
  edge:
    image: caddy:2-alpine
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api, bff, web]

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: spydra
      POSTGRES_PASSWORD: spydra
      POSTGRES_DB: spydra
    volumes:
      # postgres 18 requires the mount at the parent, not .../data — mounting
      # the old path is a hard error from the image itself
      # (docker-library/postgres#1259). Same pgdata volume, same intent as
      # DEVELOPMENT.md § Compose topology.
      - pgdata:/var/lib/postgresql
      - ./docker/init-schemas.sql:/docker-entrypoint-initdb.d/10-schemas.sql:ro
      # The integration-test database (TESTING.md §1). 20- runs after 10-,
      # which creates the cluster-wide roles both of them grant to.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro
      # NOT in initdb.d on purpose: the entrypoint runs everything it finds
      # there exactly once, and this file must run once per database. Both
      # init scripts pull it in with \i (docker/crawl-bootstrap.sql).
      - ./docker/crawl-bootstrap.sql:/bootstrap/crawl-bootstrap.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spydra"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: uvicorn spydra.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/spydra
    environment: *py-env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backend:/app # bind: source, hot reload
      - .:/repo # host-side python (scripts/) for fmt/typecheck targets
      - venv:/app/.venv # named: never the bind mount
      - ${SPYDRA_DATA:-./.data}:/data
    extra_hosts: ["host.docker.internal:host-gateway"] # llama-server AND render (ADR-0023)
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    command: python -m spydra.worker
    environment: *py-env
    # Longer than the worker's SHUTDOWN_GRACE_S (20 s): Docker SIGKILLs at
    # the end of this, and a SIGKILL strands every in-flight row until its
    # two-minute lease expires instead of releasing it (spec 002 §3).
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - venv:/app/.venv
      - ${SPYDRA_DATA:-./.data}:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy:
      replicas: 1 # politeness is enforced in the DB; raise freely
    # NOTE: no depends_on render. A rendered domain stalls honestly when the
    # sidecar is down; static crawling is unaffected (ADR-0016).

  render:
    build: { context: ., dockerfile: docker/render.Dockerfile }
    environment:
      RENDER_CONTEXTS: ${RENDER_CONTEXTS:-3}
      RECYCLE_AFTER_PAGES: ${RECYCLE_AFTER_PAGES:-500}
      # Spec 012 §2's 5 s queue window. Overridable ONLY so the acceptance
      # suite can prove the 503 without a 5 s wall-clock wait per case; the
      # default is the spec, so a test that forgets to set it sees spec
      # behaviour rather than test behaviour (BUILD_PLAN 1.5).
      RENDER_QUEUE_WAIT_MS: ${RENDER_QUEUE_WAIT_MS:-5000}
    volumes:
      # The suite under render/tests is the gate for spec 012 §6, and without
      # these binds it ran the IMAGE's copy: a planted failing test was never
      # seen and `make test-render` still exited 0. The Dockerfile keeps its
      # COPY so the shipped image is self-contained; in dev the mount wins.
      #
      # TWO NARROW BINDS, NOT `./render:/app`, and both read-only:
      #   - `node_modules` stays the image's. A named volume over it would be
      #     populated once and never again, so moving the playwright pin and
      #     the image tag together (ADR-0016, ADR-0017) would still leave the
      #     OLD driver mounted against the NEW browsers — the one mismatch
      #     render.Dockerfile's header says costs a day.
      #   - read-only because this container runs a real browser over
      #     operator-supplied URLs (spec 012 §3, "the largest attack surface
      #     in the system"). `./render:/app` read-write would let a page that
      #     achieved execution in here rewrite its own source on the host,
      #     tracked in git and executed on the next boot. `npm test` never
      #     writes to /app.
      - ./render/src:/app/src:ro
      - ./render/tests:/app/tests:ro
      # 1.4's fixture site, read-only. render is ALONE on egress (ADR-0023),
      # so the api container's fixture server is unreachable by design — the
      # suite runs 1.4's own stdlib server on this container's loopback
      # instead of owning a second copy of the route table.
      - ./backend/tests/fixtures:/fixtures:ro
    shm_size: 1gb # Chromium crashes oddly on the 64 MB default
    networks:
      [egress] # alone. api/worker reach it via the host loopback
      # (ADR-0023) — a shared network would give a crawled
      # page a route back to api. No extra_hosts either.
    ports: ["127.0.0.1:3001:3001"] # loopback publish IS the fetch path
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s

  # Phase 1's exit only (ADR-0036): 1.4's own fixture server, reachable from
  # the worker (default) AND the browser (egress), so both fetchers crawl the
  # same site. Behind a profile, so `make up` never starts it, and no host
  # port. The aliases give each fixture domain a host of its own, because
  # politeness and templates are per host.
  fixtures:
    profiles: [phase1-exit]
    image: python:3.15-slim
    working_dir: /app
    command: python -m tests.fixtures.server
    environment:
      FIXTURE_PORT: "8099"
    volumes:
      - ./backend/tests:/app/tests:ro
    networks:
      default:
        aliases: [vantage.fixtures, mertens.fixtures, orbis.fixtures]
      egress:
        aliases: [vantage.fixtures, mertens.fixtures, orbis.fixtures]

  bff:
    build: { context: ., dockerfile: docker/bff.Dockerfile }
    command: npm run dev
    environment:
      DATABASE_URL: postgres://spydra_bff:spydra@db:5432/spydra
      CRAWLER_API_BASE: http://api:8000 # direct, not through the edge
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./bff:/app
      - .:/repo # prettier over root-level docs and yaml, via make
        # fmt-staged-js — no other container sees them
      - bff_modules:/app/node_modules # named: platform binaries
    ports: ["127.0.0.1:3000:3000"]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE: "" # same origin via the edge
    volumes:
      - ./frontend:/app
      - ./design:/design:ro # theme.css imports design/tokens/* (ADR-0018);
        # read-only, the design system is canonical there
      - web_modules:/app/node_modules
    ports: ["127.0.0.1:5173:5173"]

networks:
  default: # api, worker, bff, db, edge, web
  egress: # render only — no route inward, none needed outward-in

volumes:
  pgdata:
  venv:
  bff_modules:
  web_modules:
