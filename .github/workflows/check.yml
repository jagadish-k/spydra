# CI runs exactly `make check` — the same command, in the same images, that
# pre-push runs locally (WORKFLOW.md §2, ADR-0022 §3). Green locally means
# green here, because they are not two gates; they are one gate in two
# places. Plus `make migrate-down`, because a schema change nobody can roll
# back is a trap the local gate cannot see.
#
# There is no remote yet (WORKFLOW.md §1) — this workflow is inert until one
# exists; its steps are proven locally via the same make targets.

name: check

on:
  pull_request:
  push:
    branches: [develop]

# One job, deliberately: the point of the gate is that it is ONE command.
jobs:
  check:
    runs-on: ubuntu-24.04-arm # arm64 — same architecture as dev/target
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Build first so a broken image fails the build step, not a test step.
      - name: Build images
        run: docker compose build

      # The database needs one boot for init-schemas.sql (roles + grants)
      # before migrations can run. Nothing else starts: `make check` needs
      # no listener (ADR-0013 export is an in-container import).
      - name: Start database
        run: docker compose up -d db

      - name: Migrate both chains up
        run: make migrate

      - name: Migrate both chains down # CI asserts this works (WORKFLOW.md §2)
        run: make migrate-down

      # 0.13 is a CYCLE, not a one-way trip. up -> down alone leaves the
      # re-apply untested, which is the half that breaks when a hand-written
      # down.sql is not the exact inverse of its up (ADR-0024).
      - name: Migrate both chains up again
        run: make migrate

      # BUILD_PLAN 0.6 and 0.7 are the two the plan says cost a day each if
      # deferred, and both fail silently: a dropped grant looks like nothing
      # until the BFF writes a table it should not, and buffered SSE looks
      # like a frontend bug. Proved once by hand in phase 0; these two steps
      # are what stop them regressing (phase-0 audit, finding F4).
      - name: Prove the BFF role cannot write crawl # 0.7, spec 010 §3
        run: make verify-grants

      - name: Prove SSE streams unbuffered through the edge # 0.6, spec 010 §2
        run: |
          docker compose up -d edge api
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8080/api/crawler/healthz >/dev/null; do sleep 1; done'
          # Assert on ARRIVAL GAPS, not on the payload — a batched response
          # contains exactly the right bytes. Accept-Encoding is sent because
          # a browser always sends it, and the site block runs `encode zstd
          # gzip` ahead of every handle; --compressed decodes so the frames
          # are readable as text either way.
          curl -sN --compressed -H 'Accept-Encoding: gzip' \
            http://127.0.0.1:8080/api/crawler/runs/__smoke/events \
          | perl -ne 'BEGIN { use Time::HiRes qw(time); $n = 0 }
                      next unless /^data:/;
                      my $t = time;
                      if ($p) {
                        my $g = $t - $p;
                        die sprintf("batched: frame %d arrived %.2fs after the last\n", $n, $g)
                          if $g < 0.5;
                      }
                      $p = $t; $n++;
                      END { die "got $n frames, want 6\n" unless $n == 6 }'

      - name: make check # lint · types · tests · generated drift
        run: make check

      # ADR-0043: build the component workshop and publish it to Chromatic.
      # Guarded on the token — until the human creates the project (task-file
      # open question) this step skips silently, which is correct. The build
      # deliberately lives here and not in `make check` (too slow for the gate).
      - name: Storybook build + Chromatic
        if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          make storybook-build
          make chromatic

      # BUILD_PLAN 1.14: the phase 1 exit criterion, against the live stack.
      # Both fetchers through one scheduler, render stopped mid-way. A gate
      # that only runs by hand stops being true without anyone noticing.
      # ADR-0036 for the `fixtures` profile. The same compose file as a Mac:
      # the worker reaches render over `render-link` (ADR-0038).
      - name: Phase 1 exit
        run: make phase1-exit
