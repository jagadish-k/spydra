# Publishes the developer briefing deck to GitHub Pages.
#
# The deck is a single self-contained page plus its assets, so there is no build
# step — docs/deck/ is uploaded as the site root. The Figma prototype on the
# "Try it" slide is an iframe to embed.figma.com and needs the Figma file set to
# "Anyone with the link · can view"; everything else works regardless.
name: pages

on:
  push:
    branches: [develop]
    paths:
      - "docs/deck/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages needs these; nothing else in this workflow writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running deploy — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the deck is missing its entry point
        run: test -f docs/deck/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/deck

      - id: deployment
        uses: actions/deploy-pages@v4
