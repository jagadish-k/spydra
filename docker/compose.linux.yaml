# Linux Docker Engine only (CI, cloud containers). Used by `make phase1-exit`.
#
# ADR-0023 reaches the render sidecar through the host loopback:
# `RENDER_BASE_URL=http://host.docker.internal:3001` with render published on
# 127.0.0.1. That works on Docker Desktop, the project's dev and target
# platform, where the host's loopback is reachable from containers. On Linux
# Docker Engine, `host-gateway` is the docker0 bridge address and a port bound
# to 127.0.0.1 refuses it, so the worker cannot reach the sidecar at all
# (measured: connection refused).
#
# This adds a second publish on that bridge address, which is what
# `host-gateway` resolves to. The 127.0.0.1 publish is kept and nothing is
# bound to 0.0.0.0, but this IS a hole in ADR-0023's boundary while it is up:
# a page in the browser can reach the sidecar's own API at the bridge address
# (measured in review). So it is recorded in ADR-0036 as a second bounded
# exception, `make phase1-exit` is its only user, and the script recreates
# render from compose.yaml alone when it finishes.
services:
  render:
    ports: ["${DOCKER_HOST_GATEWAY:-172.17.0.1}:3001:3001"]
