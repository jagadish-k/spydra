[project]
name = "spydra"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    # Runtime, not dev: HttpxFetcher is the static crawl path (BUILD_PLAN
    # 1.6) and RenderServiceFetcher talks to the sidecar over it (1.7), so
    # the worker cannot start without it. It sat in the `dev` group until
    # 1.6 and imported anyway, because `uv sync --frozen` installs uv's
    # default group set — which is also why the shipped images carry ruff,
    # mypy and pytest. httpx2, not httpx: ADR-0028.
    "httpx2",
    "sqlalchemy[asyncio]", # Core only, asyncpg driver — ADR-0014
    "uvicorn",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    # NOTE: import-linter is deliberately absent. Its compiled core (grimp)
    # publishes no cp315 manylinux aarch64 wheels as of 2026-10-15
    # (verified on PyPI; x86_64 and cp315t exist, plain aarch64 does not),
    # and this project's dev and target machines are arm64 — the ADR-0017
    # readiness gate fails. The domain→adapters contract is enforced instead
    # by a stdlib-AST pytest (task 0.8), which blocks CI where a lint only
    # warns. Re-evaluate import-linter if grimp ships the wheel.
    # httpx2, not httpx. Starlette 1.8's TestClient warns on httpx and asks
    # for httpx2 by name; httpx2 2.13.1 is the continuation Pydantic
    # maintains, classifies for 3.10–3.15, and is a drop-in here (verified:
    # the TestClient suite passes with httpx removed entirely).
    #
    # Settled by ADR-0028: httpx2 is the Fetcher's client too (BUILD_PLAN
    # 1.6/1.7), and HTTP is mocked with httpx2.MockTransport rather than
    # respx — which supports neither httpx2 nor 3.15. One client, one
    # dependency, and the mocking seam ships inside it.
    #
    # It is declared in [project].dependencies now, because the Fetcher
    # needs it at RUNTIME (1.6). Named here only in this comment: listing
    # it in both places would be two sources of truth for one pin.
    #
    # ---- pytest-asyncio ----
    # Test-only, pure Python, so the ADR-0017 readiness gate is not in play
    # (no compiled core, no wheel to wait for). Needed because every
    # integration test in TESTING.md §2 is async against a real asyncpg
    # connection, and the alternative — asyncio.run() inside sync tests —
    # cannot share a connection across the two-worker concurrency fixtures
    # that lane A's claim-query tests are built on.
    "pytest-asyncio",
]

[tool.uv]
# Virtual project until task 0.8 lands the package source: lock/sync resolve
# dependencies only and never build or install the spydra package itself —
# the bind mount and PYTHONPATH=/app make it importable at runtime.
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort-style import sorting
    "UP",  # pyupgrade — keep syntax current for the pinned python
    "B",   # bugbear
]

[tool.ruff.lint.isort]
# Without this `spydra` sorts as third-party, so every module that imports it
# absolutely fails I001 in a way the fix makes worse. First real absolute
# import of it arrives with the ports in BUILD_PLAN 1.2.
known-first-party = ["spydra"]

[tool.ruff.lint.per-file-ignores]
# Alembic's script template carries `sa`/`op` imports statically so
# autogenerated bodies can use them; an empty baseline cannot. Keep the
# template canonical rather than per-file noqa-ing every generated file.
"migrations/versions/*" = ["F401"]

[tool.pytest.ini_options]
# `auto`: every async test is run by pytest-asyncio without a per-test
# marker. The suite is async by default here — the database driver is
# asyncpg — so opting in on each test would be noise that someone eventually
# forgets, and a forgotten marker silently skips the test rather than
# failing it.
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need a real database (TESTING.md §1) and are selected
# out with `-m "not integration"` when one is not available. `make test-api`
# always has one.
markers = [
    "integration: needs a real Postgres (TESTING.md §1)",
]
# Every warning is an error. A deprecation printed in the summary at the
# bottom of a green run is a deprecation nobody reads — the httpx2 one sat
# there for four runs. Measured before turning this on: with httpx2 in place
# the suite emits ZERO warnings, so this starts clean rather than starting
# with a wall of ignores.
#
# When a new one appears the run fails and names it. That is the point. Add
# an `ignore::` line here only with the reason and the condition for removing
# it — never to quiet something unread.
filterwarnings = ["error"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# asyncpg ships no inline types and we deliberately do not carry third-party
# stubs for one healthz query; the narrow use here is coerced at the boundary.
module = "asyncpg.*"
ignore_missing_imports = true
