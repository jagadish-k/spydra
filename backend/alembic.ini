# Spydra crawl-schema migrations (ADR-0014). Intentionally minimal: the
# database URL never lives here — migrations/env.py reads DATABASE_URL from
# the environment (compose default: postgresql+asyncpg://spydra_api@db/spydra)
# so this file stays secret-free and environment-agnostic.

[alembic]
script_location = migrations

# The alembic runtime logger goes straight to the console at INFO: the
# "Running upgrade/downgrade" lines are the audit trail `make migrate` exists
# to produce. Root stays at WARNING so SQLAlchemy engine chatter stays quiet.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic.runtime.migration

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
