<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resin Fibre Disc 115mm P60 — Vantage Abrasives</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- An IMAGE-ONLY schema.org/Product stub: the shape an SEO or
         social-sharing plugin emits, carrying a share image and nothing
         else. Below it is product.html's markup, unchanged, so the approved
         vantage template still resolves every field. Rung 1 finds a Product
         here and extracts only an asset URL, which is not empty (ADR-0027)
         but has nothing the content hash can compare (spec 003 §4) — so the
         template has to get its chance. Without a template the stub's image
         is all there is, and it must still come back. The share image's path
         is deliberately one the gallery does not use, so a test can tell
         which rung produced it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "image": "/img/rfd-115-060-share.jpg"
      }
    </script>
  </head>
  <body>
    <header><a href="/">Vantage Abrasives</a></header>
    <nav class="breadcrumb">
      <a href="/catalog/">Catalogue</a>
      <a href="/catalog/abrasives/">Abrasives</a>
      <a href="/catalog/abrasives/discs/">Discs</a>
    </nav>
    <main class="product">
      <h1 class="product__title">Resin Fibre Disc 115mm P60</h1>
      <div class="product__price">£14.75</div>
      <div class="product__availability">In stock</div>
      <div class="product__sku">VA-RFD-115-060</div>
      <div class="product__vendor">Vantage Abrasives</div>
      <div class="gallery">
        <img class="gallery__image" src="/img/rfd-115-060-a.jpg" alt="front" />
        <img class="gallery__image" src="/img/rfd-115-060-b.jpg" alt="back" />
      </div>
      <div class="product__description">
        Zirconia resin fibre disc for weld dressing and heavy stock removal on
        steel and stainless.
      </div>
      <table class="product__specs">
        <tr>
          <th>Diameter</th>
          <td>115 mm</td>
        </tr>
        <tr>
          <th>Grit</th>
          <td>P60</td>
        </tr>
        <tr>
          <th>Backing</th>
          <td>Resin fibre</td>
        </tr>
        <tr>
          <th>Max RPM</th>
          <td>13300</td>
        </tr>
      </table>
    </main>
  </body>
</html>
