<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hex Head Set Screw M8x40 — Northfield Fixings</title>
  </head>
  <body>
    <!-- THE MOST VALUABLE FIXTURE IN THE SUITE.
         Same URL as before a redesign; every class name the template was
         approved against is gone. HTTP 200, real product content on the
         page, and a template that resolves NOTHING. That is the failure
         spec 003 §3 calls the most important: no error, no crash, just
         wrong data.
         With nothing required (ADR-0027) `empty_extraction` must fire here.
         The page HAS a prior non-empty observation in the test that uses
         it, so it must ALSO count toward the broken threshold (ADR-0030) —
         which is exactly what product-missing.html must not do.
         The old template looked for .product__title / .product__price. -->
    <main data-view="pdp">
      <section data-slot="heading">
        <span data-field="name">Hex Head Set Screw M8x40</span>
      </section>
      <section data-slot="commerce">
        <span data-field="amount">£0.38</span>
        <span data-field="stock-state">Available</span>
      </section>
      <section data-slot="copy">
        <p data-field="blurb">
          Grade 8.8 zinc-plated hex head set screw, fully threaded.
        </p>
      </section>
    </main>
  </body>
</html>
